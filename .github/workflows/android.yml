name: Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^versionName=' android/version.properties | cut -d= -f2)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Building signed release"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            export ANDROID_KEYSTORE_PATH=release.keystore
            gradle --no-daemon assembleRelease
            APK=app/build/outputs/apk/release/app-release.apk
          else
            echo "No signing secrets: building debug APK"
            gradle --no-daemon assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
          fi
          test -f "$APK"
          cp "$APK" "../midipult-android-${{ steps.version.outputs.name }}.apk"
          cd ..
          sha256sum "midipult-android-${{ steps.version.outputs.name }}.apk" \
            > "midipult-android-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: midipult-android
          path: |
            midipult-android-*.apk
            midipult-android-*.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MidiPult Android ${{ steps.version.outputs.name }}
          body: |
            Android-оболочка MidiPult ${{ steps.version.outputs.name }}.
            Панель загружается с вашей станции; обновления панели не требуют
            пересборки APK.
          files: |
            midipult-android-${{ steps.version.outputs.name }}.apk
            midipult-android-${{ steps.version.outputs.name }}.apk.sha256
