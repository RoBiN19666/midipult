# /opt/etc/lighttpd/myweb.conf — пульт «Станция Миди»
#
# Проверка конфига:  /opt/sbin/lighttpd -tt -f /opt/etc/lighttpd/myweb.conf
# Перезапуск:        /opt/etc/init.d/S99mypult reload
#
# В Entware lighttpd собран модульным: часть mod_*.so ставится отдельными
# пакетами (yse install lighttpd-mod-cgi). mod_setenv нужен, чтобы отдавать
# no-store и не показывать старую версию панели после обновления.
#
# Запуск только этим конфигом, чтобы не задеть системный lighttpd:
#   /opt/sbin/lighttpd -f /opt/etc/lighttpd/myweb.conf

server.document-root = "/data/myweb"
server.port         = 8055
server.bind         = "0.0.0.0"

server.modules = (
    "mod_indexfile",
    "mod_proxy",
    "mod_cgi",
    "mod_staticfile",
    "mod_access",
    "mod_setenv",
)

# Панель обновляется заливкой, поэтому кэш браузера только мешает:
# без этого телефон может месяцами показывать старый index.html.
setenv.add-response-header = ( "Cache-Control" => "no-store, must-revalidate" )

server.tag              = "mypult/1.0"
server.pid-file         = "/tmp/mypult-lighttpd.pid"
server.errorlog         = "/tmp/mypult-lighttpd-error.log"
server.upload-dirs      = ( "/tmp" )
server.follow-symlink   = "disable"

index-file.names            = ( "index.py" )
static-file.exclude-extensions = ( ".py" )
url.access-deny             = ( ".conf", "index.html" )

# Сам index.html напрямую не отдаём: только через index.py, который
# проверяет PIN-куку. Иначе оверлей входа можно было бы просто удалить.
$HTTP["url"] == "/index.py" {
    cgi.assign = ( ".py" => "/opt/bin/python3" )
}

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "application/javascript; charset=utf-8",
    ".json" => "application/json; charset=utf-8",
    ".svg"  => "image/svg+xml",
    ".png"  => "image/png",
    ".ico"  => "image/x-icon",
    ".woff2"=> "font/woff2",
    ".txt"  => "text/plain; charset=utf-8",
)

# ---------------------------------------------------------------- CGI -------
# Python-скрипты живут только в /cgi-bin и запускаются интерпретатором
# из Entware. Вне этого каталога .py не исполняется.
$HTTP["url"] =~ "^/cgi-bin/" {
    cgi.assign = ( ".py" => "/opt/bin/python3" )
}

# ------------------------------------------------------------- Luna API -----
# /luna/api/... -> http://127.0.0.1:8099/api/...
# recognize блокирующий: если прокси обрывает долгий ответ, раскомментируйте
# read-timeout в описании бэкенда (это опция gw_backend, не отдельная директива):
#
#   "" => ( ( "host" => "127.0.0.1", "port" => 8099,
#             "connect-timeout" => 5, "read-timeout" => 300 ) )
#
$HTTP["url"] == "/state" {
    proxy.server = (
        "" => ( ( "host" => "127.0.0.1", "port" => 8057 ) )
    )
}

$HTTP["url"] =~ "^/luna/" {
    proxy.server = (
        "" => ( ( "host" => "127.0.0.1", "port" => 8099 ) )
    )
    proxy.header = (
        "map-urlpath" => ( "/luna/" => "/" )
    )
}
