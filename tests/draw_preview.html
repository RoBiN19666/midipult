<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>draw preview</title>
<style>html,body{margin:0;background:#07090f}iframe{display:block;width:1240px;height:1000px;border:0}</style>
</head>
<body>
<iframe id="f" src="/index.html"></iframe>
<script>
(function () {
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    setTimeout(function () {
      var w = f.contentWindow;
      var d = f.contentDocument;
      var fire = function (el) {
        el.dispatchEvent(new w.MouseEvent('click', { bubbles: true, cancelable: true }));
      };
      fire(d.getElementById('btnDraw'));
      setTimeout(function () {
        var rects = d.querySelectorAll('#seg7Digits rect');
        // погасим/зажжём несколько палочек, чтобы получился «рисунок»
        [0, 1, 9, 16].forEach(function (i) { fire(rects[i]); });
      }, 400);
    }, 900);
  });
})();
</script>
</body></html>
